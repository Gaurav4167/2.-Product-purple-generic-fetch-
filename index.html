<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Product Management</title>
</head>

<body>
    <div class="container">
        <div class="row mt-5">
            <div class="col-md-12">
                <div class="card" id="mainCard">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-12">
                                <div class="d-flex justify-content-between" id="card-top-header">
                                    <div>
                                        <h4 id="productCountHeading">20 Total products</h4>
                                        <p>View and update your product list here</p>
                                    </div>
                                    <div id="addButtonMain">
                                        <button class="btn btn-primary"><b><i class="fa-solid fa-plus mr-2"
                                                    id="plus-button"></i>Add product</b></button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-12">
                                <div id="double-border"></div>
                            </div>
                        </div>

                        <div class="row mt-3 productRow">
                            <div class="col-md-12" id="productRow">
                                <!-- <div class="row">
                                    <div class="col-md-3">
                                        <h5>Magic brush</h5>
                                        <p class="text-primary price">Rp 120</p>
                                    </div>
                                    <div class="col-md-2 offset-md-1">
                                        Cosmetics
                                    </div>
                                    <div class="col-md-2 offset-md-1">
                                        In stock
                                    </div>
                                    <div class="col-md-1 offset-md-1">
                                        <button class="btn btn-primary"> Edit</button>
                                    </div>
                                    <div class="col-md-1">
                                        <button class="btn btn-danger">Delete</button>
                                    </div>
                                </div> -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-md-8 offset-md-2 formColumn" id="formColumn">
                <div class="card shadow">
                    <div class="card-body">
                        <h4 class="text-center mb-3" id="formHeading">Add Product</h4>
                        <i role="button" class="fa-solid fa-xmark" id="crossMark"></i>
                        <div class="border-bottom "></div>
                        <form id="productForm">
                            <div class="row">

                                <div class="form-group col-md-6">
                                    <label class="mt-4" for="pName"><b><i
                                                class="fa-brands fa-product-hunt mr-1"></i>Product Name</b></label>
                                    <input type="text" class="form-control" id="pName" placeholder="Enter product name" required>
                                </div>

                                <div class="form-group col-md-6">
                                    <label class="mt-4" for="price"><b> <i
                                                class="fa-solid fa-indian-rupee-sign"></i>Price</b></label>
                                    <input type="number" class="form-control" id="price" placeholder="Product Price" required>
                                </div>

                                <div class="form-group col-md-6">
                                    <label class="mt-4" for="category"><b><i class="fa-solid fa-list"></i>
                                            Category</b></label>
                                    <select class="form-control" name="" id="category" placeholder="" required>
                                        <option value="">Category</option>
                                        <option value="Electronics">Electronics</option>
                                        <option value="Clothing">Clothing</option>
                                        <option value="Shoes">Shoes</option>
                                        <option value="Beuty">Beuty</option>
                                        <option value="Books">Books</option>
                                        <option value="Ferniture">Ferniture</option>
                                        <option value="Cosmetics">Cosmetics</option>
                                    </select>
                                </div>

                                <div class="form-group col-md-6">
                                    <label class="mt-4" for="stock"><b><i class="fa-solid fa-list"></i>
                                            Available</b></label>
                                    <select class="form-control" name="" id="stock" placeholder="" required>
                                        <option value="Yes">Yes</option>
                                        <option value="No">No</option>

                                    </select>
                                </div>

                                <div class="form-group col-md-6">
                                    <label class="mt-4" for="quantity"><i class="fa-solid fa-hashtag"></i>
                                        <b>Quantity</b></label>
                                    <input class="form-control" type="number" id="quantity"
                                        placeholder="Quantity(How much)" min="0" required>
                                </div>

                                <button type="submit" class="btn btn-primary col-md-2 m-2" id="addBtn">
                                    Add product
                                </button>
                                <button type="button" class="btn btn-primary col-md-2 m-2 d-none" id="updateBtn">
                                    Update
                                </button>

                                <button type="button" class="btn btn-secondary col-md-2 m-2" id="clearBtn">
                                    Clear
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="spinner" class="d-none">
        <div class="spinner-border" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
